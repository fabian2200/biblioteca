<!DOCTYPE html>
<html lang="en">

<head>
	<title>Huesos del pie</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link type="text/css" rel="stylesheet" href="main.css">
	<link href="../bootstrap/bootstrap.min.css" rel="stylesheet">
	<!-- Bootstrap JS (requerido para modales) -->
	<script src="../bootstrap/bootstrap.bundle.min.js"></script>
	<link rel="stylesheet" href="../bootstrap/style.css" />
	<link rel="stylesheet" href="../fontawesome/css/all.min.css">
	<script src="../jquery-3.7.1.min.js"></script>
	<style>
		.lil-gui {
			position: absolute !important;
			right: 0 !important;
			width: 100%;
		}

		.children .lil-gui {
			position: relative !important;
			width: 100% !important;
		}
	</style>
	<link rel="stylesheet" href="./css/index.css">
</head>

<body>

	<div id="labels-container"></div>

	<!-- Controls display for spaceship view -->
	<div id="spaceship-controls" class="controls-display">
		<div class="controls-title">Controles de la Nave:</div>
		<div class="controls-container">
			<div class="control-item">
				<span class="key-symbol">W</span> Adelante
			</div>
			<div class="control-item"><span class="key-symbol">S</span> Atrás</div>
			<div class="control-item">
				<span class="key-symbol">A</span> Izquierda
			</div>
			<div class="control-item">
				<span class="key-symbol">D</span> Derecha
			</div>
			<div class="control-item"><span class="key-symbol">Q</span> Arriba</div>
			<div class="control-item"><span class="key-symbol">E</span> Abajo</div>
			<div class="control-item">
				<span class="key-symbol">⬆️⬇️⬅️➡️</span> Rotar
			</div>
		</div>
	</div>

	<!-- Controls display for system view -->
	<div id="system-controls" class="controls-display">
		<div class="controls-title">Controles del Sistema:</div>
		<div class="control-item">
			<span class="key-symbol">🖱️</span> Click izquierdo + Arrastrar para rotar cámara
		</div>
		<div class="control-item">
			<span class="key-symbol">🖱️</span> Click derecho + arrastrar para mover el Modelo
		</div>
	</div>

	<!-- Modal de información del planeta -->
	<div id="miModal" class="modal-flotante">
		<div class="d-flex justify-content-end align-items-center gap-3" id="botones-modal">
			<span id="boton-hablar" ><i class="fa-solid fa-volume-high"></i></span>
			<span class="cerrar-modal" id="cerrar-modal"><i style="color: red; font-size: 40px;" class="fa-solid fa-xmark"></i></span>
		</div>
        <!-- Botones de las Pestañas -->
		<h3 id="modal-nombre-texto">Cargando...</h3>
        <div class="pestanas-container">
            <button class="btn-pestana activa" onclick="cambiarPestana(event, 'tab-descripcion')">Descripción</button>
            <button class="btn-pestana" onclick="cambiarPestana(event, 'tab-funciones')">Funciones</button>
        </div>
    
        <div id="tab-descripcion" class="contenido-pestana activa">
            <p id="modal-descripcion-texto">Cargando...</p>
        </div>
        <div id="tab-funciones" class="contenido-pestana">
            <p id="modal-funciones-texto">Cargando...</p>
        </div>
    </div>


	<div id="container"></div>

	<div id="loading-container">
		<div class="loading-container-content">
			<div id="loading-text">Cargando modelo</div>
			<div class="contenedor" style="position: relative;">
				<span id="barra-text">0%</span>
				<div id="barra" class="barra">
				</div>
			</div>
		</div>
	</div>

	<div class="info" style="font-size: 18px; padding: 8px;">Sistema Targumentario</div>


	<script type="importmap">
		{
			"imports": {
				"three": "../build/three.module.js",
				"three/addons/": "./jsm/"
			}
		}
	</script>

	<script src="./js/index.js"></script>

	<script type="module">

		var partesSistematargumentario = [
			{
				id: "PM3D_Sphere3D2_343_PM3D_Sphere3D2_343_0",
				nombre: "Tejido adiposo",
				descripcion: "<p></p>",
				funcion: ""
			},
            {
				id: "Skin_ZSphere_4_Skin_ZSphere_4_0",
				nombre: "Tallo de pelo",
				descripcion: "<p></p>",
				funcion: ""
			},
            {
				id: "Skin_ZSphere6_Skin_ZSphere6_0",
				nombre: "Venas y arterias",
				descripcion: "<p></p>",
				funcion: ""
			},
            {
				id: "PM3D_Cube3D5_953_PM3D_Cube3D5_953_0",
				nombre: "Estracto basal",
				descripcion: "<p></p>",
				funcion: ""
			},
            {
				id: "Epischdermis_Epischdermis_0",
				nombre: "Estracto espinoso",
				descripcion: "<p></p>",
				funcion: ""
			},
			{
				id: "Big_Big_0",
				nombre: "Capa córnea",
				descripcion: "<p></p>",
				funcion: ""
			},
			{
				id: "PM3D_Sphere3D2_2_PM3D_Sphere3D2_2_0",
				nombre: "Muscolo piloerector",
				descripcion: "<p></p>",
				funcion: ""
			},
			{
				id: "Extract1_Extract1_0",
				nombre: "Glandula cebásea",
				descripcion: "<p></p>",
				funcion: ""
			},
			{
				id: "Skin_ZSphere29_11_Skin_ZSphere29_11_0",
				nombre: "Glandula sudorípara",
				descripcion: "<p></p>",
				funcion: ""
			},
			{
				id: "Extract3_1_Extract3_1_0",
				nombre: "Corpúsculo de paricini",
				descripcion: "<p></p>",
				funcion: ""
			},
		];


		import * as THREE from 'three';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

		let scene, camera, renderer, controls;

		// Inicializar escena
		scene = new THREE.Scene();
		scene.background = new THREE.Color("#F2D2B6");

        // Luz ambiental
        const ambientLight = new THREE.AmbientLight(0xffffff, 3);
        scene.add(ambientLight);

        // Luz direccional
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);

        const light1 = new THREE.DirectionalLight(0xffffff, 3);
        light1.position.set(10, 10, 10);
        scene.add(light1);

        const light2 = new THREE.DirectionalLight(0xffffff, 2);
        light2.position.set(-10, 10, -10);
        scene.add(light2);

		// Luz desde abajo hacia arriba
		const bottomLight = new THREE.DirectionalLight(0xffffff, 1.5);
		bottomLight.position.set(0, -10, 0);
		bottomLight.target.position.set(0, 0, 0);

		scene.add(bottomLight);
		scene.add(bottomLight.target);

		

		// Cámara
		camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
		camera.position.set(800, 150, -400);
		camera.updateProjectionMatrix();

		// Renderizador
		renderer = new THREE.WebGLRenderer({ antialias: true });
		renderer.setSize(window.innerWidth, window.innerHeight);
		document.body.appendChild(renderer.domElement);

		// Controles orbitales
		controls = new OrbitControls(camera, renderer.domElement);
		const distanciaInicial = camera.position.length();

		controls.maxDistance = distanciaInicial;
		controls.minDistance = 50;
		// Luz
		const light = new THREE.HemisphereLight(0xffffff, 0x444444, 4.0); // el tercer parámetro es la intensidad
		light.position.set(-120, 120, 120);
		scene.add(light);

		// Cargar modelo GLB
		const loader = new GLTFLoader();
		const raycaster = new THREE.Raycaster();
		const mouse = new THREE.Vector2();
		const objetosClickeables = []; // Aquí guardarás los nodos (meshes)
		let objetoSeleccionado = null;
		let colorOriginal = null;


		let modeloADN = null;
		loader.load(
			'models/mios/sistema_targumentar.glb',
			function (gltf) {
				modeloADN = gltf.scene;
				modeloADN.scale.set(17.5, 17.5, 17.5);
				modeloADN.position.set(-250, -290, 0);
				modeloADN.rotation.y = 0.5;
				scene.add(modeloADN);

				// Centro del modelo para OrbitControls
				const box = new THREE.Box3().setFromObject(modeloADN);
				const center = box.getCenter(new THREE.Vector3());

				controls.target.copy(center);
				camera.lookAt(center);
				controls.update();


				modeloADN.traverse((child) => {
					if (child.isMesh) {
						child.material = child.material.clone();
						child.materialOriginal = child.material.clone();
						objetosClickeables.push(child);
						console.log(
							'Nodo encontrado:',
							child.name,
							child.type
						);
					}
				});

			},
			function (xhr) {
				const porcentaje = (xhr.loaded / xhr.total) * 100;
				document.getElementById('barra').style.width = porcentaje + '%';
				document.getElementById('barra-text').innerHTML = porcentaje.toFixed(2) + '%';

				if (xhr.loaded === xhr.total) {
					setTimeout(() => {
						document.getElementById(
							'loading-container'
						).style.display = 'none';
					}, 2000);
				}
			},
			function (error) {
				console.error(
					'Error al cargar el modelo .glb',
					error
				);
			}
		);

		window.addEventListener('click', (event) => {
			// Si el clic fue dentro del modal, salir
			if (event.target.closest('.modal-flotante')) {
				return;
			}
			
			mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
			mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

			raycaster.setFromCamera(mouse, camera);

			const intersects = raycaster.intersectObjects(objetosClickeables, true);

			if (intersects.length > 0) {
				const objetoActual = intersects[0].object;

				// Si hay un objeto seleccionado anteriormente, restaurar su color
				if (objetoSeleccionado){
					objetoSeleccionado.material = objetoSeleccionado.materialOriginal.clone();
				}

				// Guardar el nuevo objeto seleccionado
				objetoSeleccionado = objetoActual;
				window.speechSynthesis.cancel();
				// Guardar el color original solo si es un nuevo objeto
				colorOriginal = objetoActual.materialOriginal.clone();
				objetoActual.material.color.set(0xff0000);
				console.log(objetoActual.name);
                posicionarModalEnPunto();
				tooltip.style.display = 'none';
			}
		});

		function posicionarModalEnPunto() {
            if (!objetoSeleccionado) return;

            const wp = new THREE.Vector3();

            // Obtener posición global del objeto
            objetoSeleccionado.getWorldPosition(wp);

            // Convertir a coordenadas de pantalla
            wp.project(camera);

            const x = (wp.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-wp.y * 0.5 + 0.5) * window.innerHeight;

            const modal = document.getElementById('miModal');

            modal.style.position = 'absolute';
            modal.style.left = `${x - modal.offsetWidth / 2}px`;
			modal.style.top = `${y - modal.offsetHeight - 20}px`;

            var info = null;
            info = partesSistematargumentario.find(parte => parte.id === objetoSeleccionado.name);
			if (info) {
				modal.style.display = 'block';
				document.getElementById('modal-nombre-texto').innerHTML = info.nombre;
                document.getElementById('modal-descripcion-texto').innerHTML = info.descripcion;
                document.getElementById('modal-funciones-texto').innerHTML = info.funcion;
            } else {
                modal.style.display = 'none';
				document.getElementById('modal-nombre-texto').innerHTML = '';
				document.getElementById('modal-descripcion-texto').innerHTML = '';
				document.getElementById('modal-funciones-texto').innerHTML = '';
            }
        }

		function actualizarModal() {
            if (!objetoSeleccionado) return;
            // Posición mundial del objeto
            const posicion = new THREE.Vector3();
            objetoSeleccionado.getWorldPosition(posicion);

            // Convertir a coordenadas de pantalla
            posicion.project(camera);

            const x = (posicion.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-posicion.y * 0.5 + 0.5) * window.innerHeight;

            const modal = document.getElementById('miModal');
            modal.style.left = `${x}px`;
            modal.style.top = `${y}px`;
        }

        
        let objetoHover = null;
		var tooltip = null;
		let materialOriginal = null;
		window.addEventListener('mousemove', (event) => {
			//verificar si el color es rojo
			
			mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
			mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

			raycaster.setFromCamera(mouse, camera);

			const intersects = raycaster.intersectObjects(
				objetosClickeables,
				true
			);

			if (!tooltip) {
				tooltip = document.createElement('div');
				tooltip.id = 'tooltip';
				document.body.appendChild(tooltip);
			}

			if (intersects.length > 0) {
				const objeto = intersects[0].object;
				const info = partesSistematargumentario.find(
					parte => parte.id === objeto.name
				);

				// Si cambió de objeto
				if (objetoHover !== objeto) {
					// Restaurar color anterior
					if (objetoHover && materialOriginal) {
						if(objetoHover.material.color.getHex() != 0xff0000){
							objetoHover.material.color.copy(materialOriginal);
						}
					}
					// Guardar color original
					objetoHover = objeto;
					materialOriginal = objeto.material.color.clone();
					// Aplicar gris
					objeto.material.color.set(0xaaaaaa);
					tooltip.innerHTML = info?.nombre?.toUpperCase();
				}

				if(info){
					tooltip.style.display = 'block';
					tooltip.style.left = (event.clientX + 15) + 'px';
					tooltip.style.top = (event.clientY + 15) + 'px';
				}else{
					tooltip.style.display = 'none';
				}
			} else {
				// Restaurar último objeto
				if (objetoHover && materialOriginal ) {
					if(objetoHover.material.color.getHex() != 0xff0000){
						objetoHover.material.color.copy(materialOriginal);
					}
				}
				objetoHover = null;
				materialOriginal = null;
				tooltip.style.display = 'none';
			}
		});

        $('#cerrar-modal').click(function() {
			window.speechSynthesis.cancel();
			document.getElementById('miModal').style.display = 'none';
			if (objetoSeleccionado){
				objetoSeleccionado.material = objetoSeleccionado.materialOriginal.clone();
			}
		});



		// Animación
		function animate() {
			requestAnimationFrame(animate);
			controls.update();
			actualizarModal();
			renderer.render(scene, camera);
		}
		animate();

		// Resize responsive
		window.addEventListener('resize', () => {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
		});


		const emularScroll = (factor) => {
			const direccion = new THREE.Vector3();
			direccion.subVectors(camera.position, controls.target).normalize(); // Dirección de la cámara

			// Calcular nueva posición
			const nuevaPosicion = camera.position.clone().addScaledVector(direccion, factor);

			// Calcular la nueva distancia a target
			const distancia = nuevaPosicion.distanceTo(controls.target);
			console.log(distancia);

			if (factor > 0) {
				if (distancia < 737) {
					camera.position.copy(nuevaPosicion);
					controls.update();
				}
			} else {
				if (distancia > 50) {
					camera.position.copy(nuevaPosicion);
					controls.update();
				}
			}
		};


		const controlesMovimiento = {
			acercar: () => emularScroll(-50),
			alejar: () => emularScroll(50),
		};

		const controlesRotacion = {
			rotarX: () => { if (modeloADN) modeloADN.rotation.x += 0.1; },
			rotarX_neg: () => { if (modeloADN) modeloADN.rotation.x -= 0.1; },
			rotarY: () => { if (modeloADN) modeloADN.rotation.y += 0.1; },
			rotarY_neg: () => { if (modeloADN) modeloADN.rotation.y -= 0.1; },
		};

		const moverCamara = {
			arriba: () => { camera.position.y += 20; controls.target.y += 20; controls.update(); },
			abajo: () => { camera.position.y -= 20; controls.target.y -= 20; controls.update(); },
			izquierda: () => { camera.position.x -= 20; controls.target.x -= 20; controls.update(); },
			derecha: () => { camera.position.x += 20; controls.target.x += 20; controls.update(); },
			adelante: () => { camera.position.z -= 20; controls.target.z -= 20; controls.update(); },
			atras: () => { camera.position.z += 20; controls.target.z += 20; controls.update(); },
		};

		const gui = new GUI();

		const carpetaMovimiento = gui.addFolder('Mover cámara');
		carpetaMovimiento.add(controlesMovimiento, 'acercar').name('Acercar <i class="fa-solid fa-plus"></i>');
		carpetaMovimiento.add(controlesMovimiento, 'alejar').name('Alejar <i class="fa-solid fa-minus"></i>');

		carpetaMovimiento.open();

		const carpetaRotacion = gui.addFolder('Rotar modelo');

		carpetaRotacion.add(controlesRotacion, 'rotarY').name('<i class="fa-solid fa-arrow-left"></i> Rotar');
		carpetaRotacion.add(controlesRotacion, 'rotarY_neg').name('<i class="fa-solid fa-arrow-right"></i> Rotar');
		carpetaRotacion.add(controlesRotacion, 'rotarX').name('<i class="fa-solid fa-arrow-up"></i> Rotar');
		carpetaRotacion.add(controlesRotacion, 'rotarX_neg').name('<i class="fa-solid fa-arrow-down"></i> Rotar');

		carpetaRotacion.open();

		const carpetaMover = gui.addFolder('Mover cámara libre');
		carpetaMover.add(moverCamara, 'arriba').name('Arriba <i class="fa-solid fa-arrow-up"></i>');
		carpetaMover.add(moverCamara, 'abajo').name('Abajo <i class="fa-solid fa-arrow-down"></i>');
		carpetaMover.add(moverCamara, 'izquierda').name('Izquierda <i class="fa-solid fa-arrow-left"></i>');
		carpetaMover.add(moverCamara, 'derecha').name('Derecha <i class="fa-solid fa-arrow-right"></i>');
		
		carpetaMover.open();

		setTimeout(() => {
			document.getElementsByClassName('title')[0].innerHTML = 'Controles del sistema';
		}, 500);


		document.addEventListener('mousedown', () => {
			document.body.classList.add('grabbing');
		});

		document.addEventListener('mouseup', () => {
			document.body.classList.remove('grabbing');
		});

		// Por si se suelta el clic fuera del navegador
		document.addEventListener('mouseleave', () => {
			document.body.classList.remove('grabbing');
		});


	</script>
</body>

</html>
